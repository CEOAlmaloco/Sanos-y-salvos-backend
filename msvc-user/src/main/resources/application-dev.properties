# H2 in-memory for dev (replace with PostgreSQL in AWS later)
spring.datasource.url=jdbc:h2:mem:sanosdb;INIT=CREATE SCHEMA IF NOT EXISTS users_schema
spring.jpa.properties.hibernate.default_schema=users_schema

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Definir JWT_SECRET en entorno o en .env (ver .env.example en la raíz del backend).
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
