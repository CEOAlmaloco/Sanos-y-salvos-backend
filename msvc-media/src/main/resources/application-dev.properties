# MinIO local (puerto 9000). Mismas claves que MINIO_* en .env
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

sanos.s3.endpoint=http://localhost:9000
sanos.s3.region=us-east-1
sanos.s3.access-key=${MINIO_ROOT_USER:minioadmin}
sanos.s3.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
sanos.s3.bucket=${SANOS_MEDIA_BUCKET:sanos-media}
sanos.s3.path-style-access=true