# Local: MinIO en Docker sustituye a AWS S3 (misma API). Credenciales desde .env (MINIO_*).
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

sanos.s3.endpoint=${MINIO_ENDPOINT:http://minio:9000}
# URLs firmadas para abrir en el navegador del host (mismo MinIO mapeado al puerto 9000)
sanos.s3.presign-endpoint=${MINIO_PRESIGN_ENDPOINT:http://localhost:9000}
sanos.s3.region=${AWS_REGION:us-east-1}
sanos.s3.access-key=${MINIO_ROOT_USER}
sanos.s3.secret-key=${MINIO_ROOT_PASSWORD}
sanos.s3.bucket=${SANOS_MEDIA_BUCKET:sanos-media}
sanos.s3.path-style-access=true
