
# Requiere archivo ".env" (copiar desde ".env.example"). No commitees secretos.
# Puertos HOST: 9081/9082/9083/9085. Red interna: servicios en 8081/8082/8083/8085.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  msvc-user:
    build:
      context: .
      dockerfile: docker/Dockerfile.msvc-user
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SANOS_PET_SERVICE_URL: http://msvc-pet:8083
      SANOS_REPORT_SERVICE_URL: http://msvc-report:8082
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9081:8081"

  msvc-pet:
    build:
      context: .
      dockerfile: docker/Dockerfile.msvc-pet
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SANOS_USER_SERVICE_URL: http://msvc-user:8081
      SANOS_REPORT_SERVICE_URL: http://msvc-report:8082
    depends_on:
      postgres:
        condition: service_healthy
      msvc-user:
        condition: service_started
    ports:
      - "9083:8083"

  msvc-report:
    build:
      context: .
      dockerfile: docker/Dockerfile.msvc-report
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SANOS_USER_SERVICE_URL: http://msvc-user:8081
      SANOS_PET_SERVICE_URL: http://msvc-pet:8083
    depends_on:
      postgres:
        condition: service_healthy
      msvc-user:
        condition: service_started
      msvc-pet:
        condition: service_started
    ports:
      - "9082:8082"

  msvc-integration:
    build:
      context: .
      dockerfile: docker/Dockerfile.msvc-integration
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SANOS_REPORT_SERVICE_URL: http://msvc-report:8082
    depends_on:
      postgres:
        condition: service_healthy
      msvc-report:
        condition: service_started
    ports:
      - "9085:8085"

volumes:
  minio_data: {}
