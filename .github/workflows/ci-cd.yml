# IE4 / IE5 / IE6 — build, test y despliegue a AWS (ECR, Lambda, ECS)
#
# Secrets requeridos en GitHub → Settings → Secrets and variables → Actions:
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_ACCOUNT_ID          (ej. 505494421794)
#   AWS_SESSION_TOKEN       (solo credenciales temporales del lab, ASIA...)

name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: sanos-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: sanos-cluster
  S3_LAMBDA_BUCKET: sanos-media-prod
  S3_LAMBDA_PREFIX: lambda-deploy
  JAVA_VERSION: "21"

jobs:
  build-and-test:
    name: Build y tests (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compilar y ejecutar tests
        env:
          JWT_SECRET: test-jwt-secret-ci-only-min-256-bits-hs256____________________________
          DB_USERNAME: admin
          DB_PASSWORD: ""
        run: mvn -B -ntp verify

  package-lambdas:
    name: Empaquetar JARs Lambda
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package shade (matching, notification, analytics)
        env:
          JWT_SECRET: test-jwt-secret-ci-only-min-256-bits-hs256____________________________
          DB_USERNAME: admin
          DB_PASSWORD: ""
        run: mvn -B -ntp -pl msvc-matching,msvc-notification,msvc-analytics -am package -DskipTests

      - name: Subir artefactos Lambda
        uses: actions/upload-artifact@v4
        with:
          name: lambda-jars
          retention-days: 7
          path: |
            msvc-matching/target/*-aws.jar
            msvc-notification/target/*-aws.jar
            msvc-analytics/target/*-aws.jar

  deploy-aws:
    name: Desplegar en AWS
    needs: package-lambdas
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar JARs Lambda
        uses: actions/download-artifact@v4
        with:
          name: lambda-jars

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Provisionar recursos cloud (IE5 — idempotente)
        run: |
          set -euo pipefail
          echo ">>> Verificar/crear bucket S3 media"
          if ! aws s3api head-bucket --bucket sanos-media-prod 2>/dev/null; then
            aws s3api create-bucket --bucket sanos-media-prod --region "${AWS_REGION}"
          fi
          echo ">>> Verificar/crear cola SQS analytics"
          QUEUE_URL="$(aws sqs get-queue-url --queue-name sanos-analytics-queue --query QueueUrl --output text 2>/dev/null || true)"
          if [ -z "${QUEUE_URL}" ]; then
            aws sqs create-queue --queue-name sanos-analytics-queue --attributes VisibilityTimeout=60,MessageRetentionPeriod=345600
          fi
          echo ">>> Verificar/crear tabla DynamoDB analytics"
          if ! aws dynamodb describe-table --table-name sanos-analytics --region "${AWS_REGION}" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name sanos-analytics \
              --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \
              --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \
              --billing-mode PAY_PER_REQUEST \
              --region "${AWS_REGION}"
            aws dynamodb wait table-exists --table-name sanos-analytics --region "${AWS_REGION}"
          fi

      - name: Build y push imágenes Docker (ECS)
        run: |
          set -euo pipefail
          services="user report pet media integration"
          for svc in $services; do
            image="${ECR_REGISTRY}/sanos/msvc-${svc}"
            echo ">>> Building msvc-${svc}"
            docker build -f "docker/Dockerfile.msvc-${svc}" -t "${image}:latest" -t "${image}:${GITHUB_SHA}" .
            docker push "${image}:latest"
            docker push "${image}:${GITHUB_SHA}"
          done

      - name: Publicar JARs Lambda en S3
        run: |
          set -euo pipefail
          aws s3 cp msvc-matching/target/msvc-matching-0.0.1-SNAPSHOT-aws.jar \
            "s3://${S3_LAMBDA_BUCKET}/${S3_LAMBDA_PREFIX}/msvc-matching-aws.jar"
          aws s3 cp msvc-notification/target/msvc-notification-0.0.1-SNAPSHOT-aws.jar \
            "s3://${S3_LAMBDA_BUCKET}/${S3_LAMBDA_PREFIX}/msvc-notification-aws.jar"
          aws s3 cp msvc-analytics/target/msvc-analytics-0.0.1-SNAPSHOT-aws.jar \
            "s3://${S3_LAMBDA_BUCKET}/${S3_LAMBDA_PREFIX}/msvc-analytics-aws.jar"

      - name: Actualizar funciones Lambda
        run: |
          set -euo pipefail
          update_lambda() {
            local fn="$1"
            local key="$2"
            aws lambda update-function-code \
              --function-name "$fn" \
              --s3-bucket "${S3_LAMBDA_BUCKET}" \
              --s3-key "${S3_LAMBDA_PREFIX}/${key}" \
              --region "${AWS_REGION}"
          }
          update_lambda sanos-matching msvc-matching-aws.jar
          update_lambda sanos-notification msvc-notification-aws.jar
          update_lambda sanos-analytics msvc-analytics-aws.jar
          update_lambda sanos-analytics-api msvc-analytics-aws.jar

      - name: Redesplegar servicios ECS
        run: |
          set -euo pipefail
          for svc in sanos-svc-user sanos-svc-report sanos-svc-pet sanos-svc-media sanos-svc-integration; do
            echo ">>> Force deployment ${svc}"
            aws ecs update-service \
              --cluster "${ECS_CLUSTER}" \
              --service "${svc}" \
              --force-new-deployment \
              --region "${AWS_REGION}" \
              --output text \
              --query 'service.serviceName'
          done
